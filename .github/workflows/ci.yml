name: CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
      - name: Syntax and migration safety
        run: |
          node --check server/index.js
          node --check server/routes/governedZoning.js
          node --check server/domain/zoningPolicy.js
          bash -n start.sh scripts/*.sh
          ! grep -Eiq '(^|[[:space:]])(DROP[[:space:]]+TABLE|TRUNCATE|DELETE[[:space:]]+FROM)' server/migrations/001_governed_zoning.sql
